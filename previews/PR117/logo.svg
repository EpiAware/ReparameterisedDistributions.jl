<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440">
  <polygon points="200,30 364.5,125 364.5,315 200,410 35.5,315 35.5,125" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" opacity="0.4"/>
  
  <!-- The Distribution Curve -->
  <path d="M 110,210 C 140,210 160,120 200,120 C 240,120 260,210 290,210" fill="none" stroke="#8b5cf6" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Axis 1: Standard Parameter Space (Theta) -->
  <line x1="90" y1="240" x2="310" y2="240" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <circle cx="160" cy="240" r="3" fill="#0ea5e9"/>
  <circle cx="240" cy="240" r="3" fill="#0ea5e9"/>
  <text x="320" y="245" font-family="serif" font-style="italic" font-size="14" fill="#64748b">θ</text>

  <!-- Axis 2: Reparameterised Space (Phi) - Non-linear / Stretched -->
  <line x1="90" y1="270" x2="310" y2="270" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <circle cx="130" cy="270" r="3" fill="#f43f5e"/>
  <circle cx="270" cy="270" r="3" fill="#f43f5e"/>
  <text x="320" y="275" font-family="serif" font-style="italic" font-size="14" fill="#64748b">φ</text>

  <!-- Mapping Vectors (Showing the transformation) -->
  <path d="M 160,240 C 150,255 140,255 130,270" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3"/>
  <path d="M 240,240 C 250,255 260,255 270,270" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3"/>

  <text x="200" y="335" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#64748b" text-anchor="middle">Reparameterised</text>
  <text x="200" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" fill="#94a3b8" text-anchor="middle">Distributions.jl</text>
</svg>
